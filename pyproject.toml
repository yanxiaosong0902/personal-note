[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-note"
version = "0.1.0"
description = "A macOS menu bar app for saving and searching personal notes."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyobjc-framework-Cocoa>=11"]
classifiers = ["Operating System :: MacOS :: MacOS X"]

[project.gui-scripts]
personal-note = "app:main"

[tool.setuptools]
py-modules = ["app", "hotkey", "launcher", "notes"]
